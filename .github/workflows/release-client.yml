name: Build Client Release

# Triggered when a release is published in the GitHub UI.
# Builds the game client for Windows, macOS (arm64 + x86_64) and Linux,
# then attaches each archive as a downloadable asset on the release.

on:
  release:
    types: [published]

permissions:
  contents: write   # required to upload assets to the release

jobs:

  build:
    name: Client — ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # all platforms run even if one fails
      matrix:
        include:

          # ── Linux x86_64 ──────────────────────────────────────────────────
          - os:         ubuntu-latest
            label:      Linux x86_64
            exe:        dist/DungeonAdventure
            asset_name: DungeonAdventure-linux-x86_64.tar.gz

          # ── Windows x86_64 ────────────────────────────────────────────────
          - os:         windows-latest
            label:      Windows x86_64
            exe:        dist/DungeonAdventure.exe
            asset_name: DungeonAdventure-windows-x86_64.zip

          # ── macOS Apple Silicon (arm64) ────────────────────────────────────
          - os:         macos-14
            label:      macOS arm64
            exe:        dist/DungeonAdventure
            asset_name: DungeonAdventure-macos-arm64.zip

          # ── macOS Intel (x86_64) ──────────────────────────────────────────
          - os:         macos-15-intel
            label:      macOS x86_64
            exe:        dist/DungeonAdventure
            asset_name: DungeonAdventure-macos-x86_64.zip

    steps:

      # ── 1. Source ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v6

      # ── 2. Python ────────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # ── 3. System deps — Linux only (SDL2 headers for pygame-ce) ─────────
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      # ── 4. Python deps ────────────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ── 5. Build — Linux / macOS ──────────────────────────────────────────
      # --collect-all src   → bundles every src.* module (avoids missing-import failures)
      # --collect-all pygame → bundles SDL2 shared libraries
      # --add-data assets:assets → bundles sprite/tile PNG assets
      # --windowed (macOS) → creates a proper .app bundle
      # --strip (Unix)     → removes debug symbols (~10 % smaller)
      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller \
            --onefile \
            --name DungeonAdventure \
            --collect-all pygame \
            --collect-all src \
            --add-data "assets:assets" \
            --strip \
            ${{ runner.os == 'macOS' && '--windowed' || '' }} \
            main.py

      # ── 5b. Build — Windows ───────────────────────────────────────────────
      # --noconsole hides the cmd.exe window; SDL creates its own game window.
      # --add-data uses ; as path separator on Windows.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --name DungeonAdventure `
            --collect-all pygame `
            --collect-all src `
            --add-data "assets;assets" `
            --noconsole `
            main.py

      # ── 6a. Package — Linux ───────────────────────────────────────────────
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czf "${{ matrix.asset_name }}" \
            -C dist DungeonAdventure
          echo "SIZE=$(du -sh ${{ matrix.asset_name }} | cut -f1)" >> "$GITHUB_ENV"

      # ── 6b. Package — Windows ─────────────────────────────────────────────
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist\DungeonAdventure.exe `
            -DestinationPath "${{ matrix.asset_name }}"

      # ── 6c. Package — macOS ───────────────────────────────────────────────
      # --windowed produces a .app bundle (directory); zip it preserving symlinks.
      # Fall back to plain binary if .app was not generated.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ -d dist/DungeonAdventure.app ]; then
            cd dist && zip -r --symlinks "../${{ matrix.asset_name }}" DungeonAdventure.app
          else
            tar -czf "${{ matrix.asset_name }}" -C dist DungeonAdventure
          fi

      # ── 7. Upload to release ──────────────────────────────────────────────
      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset_name }}
          fail_on_unmatched_files: true
